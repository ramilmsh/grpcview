syntax = "proto3";

// Package grpcview.store.v1 is the on-disk schema for a grpcview collection.
// Deliberately distinct from the wire messages in grpcview.v1; see
// service/store/convert.go.
package grpcview.store.v1;

import "google/protobuf/descriptor.proto";

option go_package = "codeberg.org/ramilmsh/grpcview/grpcview/store/v1;grpcviewstorev1";

// grpcview.work.json at the workspace root. Optional; a non-empty collections
// list wins over discovery.
message Workspace {
  int32 schema_version = 1;
  string name = 2;
  // Workspace-relative paths or globs ("services/*/requests"); empty means "scan".
  repeated string collections = 3;
  // Source DEFINITIONS shared by every collection, keyed by the same
  // config-derived id. A SET, not an order: precedence is per collection. May
  // not be an Upload, and commit_descriptors here is ignored.
  repeated DescriptorSource sources = 4;
  Defaults defaults = 5;
  BazelConfig bazel = 6;
}

message BazelConfig {
  // Absolute, or relative to the workspace root; empty walks up for MODULE.bazel.
  string root = 1;
  // Caps one build; 0 means the default (600).
  int32 timeout_seconds = 2;
}

// What a NEW collection in this workspace starts from.
message Defaults {
  // Definition ids seeded as bare references; an unmatched id is skipped.
  repeated string sources = 1;
}

// grpcview.json at the collection root; doubles as the root folder's config.
message Collection {
  int32 schema_version = 1;
  string name = 2;
  repeated string items = 3;              // ordered root-level slugs
  repeated DescriptorSource sources = 4;  // highest priority first
}

// folder.json inside a (non-root) folder directory.
message Folder {
  ItemMeta meta = 1;
  repeated string items = 2;  // ordered child slugs
  // TypeScript module feeding the gv.metadata.inherit() chain; inline UTF-8.
  string draft_metadata_script = 3;
}

// request.json inside a request directory. The body and the metadata script are
// NOT here: they are sibling body.ts / metadata.ts files, so they diff by line and
// work as esbuild entry points. See docs/design/shipped/vscode/phase-2-body-files.md.
message Request {
  ItemMeta meta = 1;
  string service = 2;
  string method = 3;
  // Ordered display names of the MIDDLEWARE scripts run before the call.
  repeated string middleware = 6;
  // Unset means "use the workspace's first reflection source" (resolveTarget).
  Target target = 9;
}

// Identity block in every managed tree file: the directory name is the stable
// slug, this is the display name, so a rename never moves a directory.
message ItemMeta {
  string name = 1;
}

// A POINTER plus authored config, never descriptor bytes. List order in
// Collection is the priority order (earlier wins).
message DescriptorSource {
  // "upload:<file name>", "reflection:<address>[+tls]" or "bazel:<//pkg:target>".
  string id = 3;
  oneof source {
    Upload upload = 1;
    Reflection reflection = 2;
    Bazel bazel = 5;
  }
  // Write what this resolves to as a committed sidecar under descriptors/
  // instead of the local blob store.
  bool commit_descriptors = 4;
}

// A FileDescriptorSet a human handed over. The null-pointer kind: nothing to
// re-acquire from, so an uncommitted upload's only copy is in local state.
message Upload {
  string file_name = 1;
  // Root-relative refresh recipe; empty from a browser file picker. Never identity.
  string path = 2;
}

// A build label whose default outputs are descriptor sets — the one kind that can
// produce its own bytes. Stored canonical ("//pkg:target").
message Bazel {
  string label = 1;
}

// descriptors.json in a collection's state directory: LOCAL STATE, the
// `id -> digest` half of the descriptor store. Covers exactly the sources whose
// descriptors are NOT committed. The other half is the content-addressed blob
// (`<state root>/blobs/<sha256>.binpb`), workspace-scoped so five collections
// share one copy. The two keys stay separate: the id is a stable pointer, which
// is what makes re-adding a source a refresh; the digest is the content key.
message DescriptorIndex {
  int32 schema_version = 1;
  // One entry per source that has resolved at least once.
  repeated DescriptorIndexEntry entries = 2;
}

message DescriptorIndexEntry {
  string source_id = 1;
  // sha256 hex of the blob's bytes, and so its file name.
  string digest = 2;
  // Stored, not derived: a reflection server's ListServices is authoritative and
  // narrower than "every service in the descriptor set".
  repeated string service_names = 3;
}

// What one source last resolved to, and the shape the store hands the layer
// above either location: the blob plus its index entry, or — with
// commit_descriptors — the committed <collection>/descriptors/<slug>-<hash>.json.
// It exists so the merged view can be rebuilt for any mutation without
// re-dialing, and between refreshes it is the only copy of a source's schema.
message ResolvedSource {
  string id = 1;
  google.protobuf.FileDescriptorSet descriptor_set = 2;
  // Narrower than "every service in descriptor_set" — see DescriptorIndexEntry.
  repeated string service_names = 3;
}

// A server to reflect schemas from; disk-local, not the wire grpcview.v1.Server.
message Reflection {
  string address = 1;  // host:port dial string
  bool tls = 2;
}

// A per-request invoke destination, independent of the schema source.
// Structurally like Reflection, kept distinct: different concept.
message Target {
  string address = 1;  // host:port dial string
  bool tls = 2;
}
