syntax = "proto3";

package echo.v1;

option go_package = "codeberg.org/ramilmsh/grpcview/proto/echo/v1;echov1";

message EchoRequest {
  string message = 1;
  int32 count = 2;
}

message EchoResponse {
  string message = 1;
  int32 index = 2;
}

service EchoService {
  // Unary: single request, single response.
  rpc Unary(EchoRequest) returns (EchoResponse);
  // ServerStream: single request, stream of responses.
  rpc ServerStream(EchoRequest) returns (stream EchoResponse);
  // ClientStream: stream of requests, single response.
  rpc ClientStream(stream EchoRequest) returns (EchoResponse);
  // BidiStream: stream of requests, stream of responses.
  rpc BidiStream(stream EchoRequest) returns (stream EchoResponse);
}
