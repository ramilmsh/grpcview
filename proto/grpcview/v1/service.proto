syntax = "proto3";

package grpcview.v1;

import "google/protobuf/descriptor.proto";
import "google/protobuf/struct.proto";
import "proto/grpcview/v1/workspace.proto";

option go_package = "codeberg.org/ramilmsh/grpcview/proto/grpcview/v1;grpcviewv1";

message AddDescriptorSourceRequest {
  string workspace_name = 1;
  oneof source {
    bytes  descriptor_set = 2;
    Server reflection     = 3;
  }
}

message AddDescriptorSourceResponse {
  Workspace workspace = 1;
}

message RemoveDescriptorSourceRequest {
  string workspace_name = 1;
  // index selects the source to remove by its position in Workspace.sources,
  // which matches the order the UI displays. Sources have no id yet (Phase 2),
  // so the index is the stable handle until then.
  int32  index = 2;
}

message RemoveDescriptorSourceResponse {
  Workspace workspace = 1;
}

message CreateFolderRequest {
  string workspace_name = 1;
  repeated string path = 2;
  string item_name = 3;
}

message CreateFolderResponse {
  Workspace workspace = 1;
}

message CreateRequestRequest {
  string workspace_name = 1;
  repeated string path = 2;
  string item_name = 3;
  string service = 4;
  string method = 5;
}

message CreateRequestResponse {
  Workspace workspace = 1;
}

message DeleteRequestRequest {
  string workspace_name = 1;
  repeated string path = 2;
  string item_name = 3;
}

message DeleteRequestResponse {
  Workspace workspace = 1;
}

message UpdateRequestRequest {
  string workspace_name = 1;
  repeated string path = 2;
  string item_name = 3;
  optional string service = 4;
  optional string method = 5;
  optional string draft_body = 6;
  optional google.protobuf.Struct draft_metadata = 7;
  // name renames the request (its display name). Unset leaves the name unchanged;
  // a rename that collides with a sibling fails with FailedPrecondition.
  optional string name = 8;
}

message UpdateRequestResponse {
  Workspace workspace = 1;
}

message GetRequest {
  string workspace_name = 1;
}

message GetResponse {
  Workspace workspace = 1;
}

// InvokeRequest executes a single unary RPC against a target server. The
// service/method/body/metadata carry the (possibly unsaved) editor state, so a
// send never depends on a prior UpdateRequest landing first. workspace_name
// identifies the collection (used to default the target from its reflection
// source and, later, to key run history by path/item_name).
message InvokeRequest {
  string                 workspace_name = 1;
  repeated string        path           = 2;
  string                 item_name      = 3;
  string                 service        = 4;
  string                 method         = 5;
  string                 body           = 6;
  google.protobuf.Struct metadata       = 7;
  // target overrides where the call is sent; when unset it defaults to the
  // workspace's first reflection source.
  optional Server        target         = 8;
}

message InvokeResponse {
  Request.Response response = 1;
}

// RunScriptRequest evaluates an ad-hoc script through the scripting engine's
// scenario profile (fresh isolated instance, no capabilities granted, no
// workspace state touched). It is the scratchpad that validates the engine end
// to end from the UI.
message RunScriptRequest {
  string source = 1;
}

// ScriptLog is one buffered console.* call captured during a run.
message ScriptLog {
  string level = 1;   // debug | log | warn | error
  string message = 2;
}

// ScriptError is a JavaScript exception (or an execution failure like a timeout)
// that propagated out of a run. line is the source line parsed from the guest
// backtrace (0 when unknown).
message ScriptError {
  string message = 1;
  string stack = 2;
  int32  line = 3;
}

// RunScriptResponse carries a run's outcome. A script that throws or times out is
// reported here (error set), NOT as a Connect-level failure — only grpcview's own
// inability to run the engine surfaces as a Connect error.
message RunScriptResponse {
  // value is the script's return value as JSON text; unset when the script
  // returned undefined (a JSON `null` return is the literal string "null").
  optional string       value = 1;
  repeated ScriptLog     logs  = 2;
  optional ScriptError   error = 3;
}

// WorkspaceService is a gRPC service that provides access to the workspace
service WorkspaceService {
  // AddDescriptorSource adds a descriptor source to the workspace, it is used to obtain workspace defitions
  rpc AddDescriptorSource(AddDescriptorSourceRequest) returns (AddDescriptorSourceResponse);
  // RemoveDescriptorSource drops the source at the given index and re-resolves
  // the workspace's services from the sources that remain.
  rpc RemoveDescriptorSource(RemoveDescriptorSourceRequest) returns (RemoveDescriptorSourceResponse);
  // Get returns the workspace snapshot
  rpc Get(GetRequest) returns (GetResponse);
  // CreateFolder creates a new folder in the workspace
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
  // CreateRequest creates a new request in the workspace
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
  // DeleteRequest deletes a request from the workspace
  rpc DeleteRequest(DeleteRequestRequest) returns (DeleteRequestResponse);
  // UpdateRequest updates a request in the workspace
  rpc UpdateRequest(UpdateRequestRequest) returns (UpdateRequestResponse);
  // Invoke executes a unary RPC against a target server and returns the result
  // (status, response body, request/response metadata, latency).
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  // RunScript evaluates an ad-hoc script through the scripting engine and returns
  // its value, console output, and any error — the scratchpad that validates the
  // engine end to end.
  rpc RunScript(RunScriptRequest) returns (RunScriptResponse);
}
