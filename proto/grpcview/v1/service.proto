syntax = "proto3";

package grpcview.v1;

import "google/protobuf/struct.proto";
import "proto/grpcview/v1/workspace.proto";

option go_package = "codeberg.org/ramilmsh/grpcview/proto/grpcview/v1;grpcviewv1";

message AddDescriptorSourceRequest {
  string collection = 1;
  oneof source {
    bytes  descriptor_set = 2;
    Server reflection     = 3;
  }
  // Identity of a descriptor_set upload; re-uploading the same name refreshes it.
  string file_name = 4;
  // Commit this source's descriptors to the repo instead of caching them in
  // local state — see DescriptorSource.commit_descriptors.
  bool commit_descriptors = 5;
}

message AddDescriptorSourceResponse {
  Collection collection = 1;
}

message RemoveDescriptorSourceRequest {
  string collection = 1;
  string id = 2;
}

message RemoveDescriptorSourceResponse {
  Collection collection = 1;
}

message RefreshDescriptorSourceRequest {
  string collection = 1;
  string id = 2;
}

message RefreshDescriptorSourceResponse {
  Collection collection = 1;
}

message ReorderDescriptorSourcesRequest {
  string collection = 1;
  // Every DescriptorSource.id in priority order — earlier wins; must be a permutation.
  repeated string ids = 2;
}

message ReorderDescriptorSourcesResponse {
  Collection collection = 1;
}

message SetDescriptorSourceCommitRequest {
  string collection = 1;
  string id = 2;
  bool commit = 3;
}

message SetDescriptorSourceCommitResponse {
  Collection collection = 1;
}

message CreateFolderRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
}

message CreateFolderResponse {
  Collection collection = 1;
}

message CreateRequestRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
  string service = 4;
  string method = 5;
}

message CreateRequestResponse {
  Collection collection = 1;
}

message DeleteRequestRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
}

message DeleteRequestResponse {
  Collection collection = 1;
}

message UpdateRequestRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
  optional string service = 4;
  optional string method = 5;
  optional string draft_body = 6;
  optional string name = 8;
  // Set-flag: true replaces `middleware` (empty clears it), false/unset leaves it.
  optional bool update_middleware = 9;
  repeated string middleware = 10;
  // TypeScript module; empty-but-present clears it.
  optional string draft_metadata_script = 12;
  // Set-flag: true replaces `target` (nil clears it), false/unset leaves it.
  optional bool update_target = 13;
  optional Server target = 14;
}

message UpdateRequestResponse {
  Collection collection = 1;
}

message UpdateFolderRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
  // TypeScript module feeding the gv.metadata.inherit() chain; empty clears it.
  optional string draft_metadata_script = 4;
  optional string name = 5;
}

message UpdateFolderResponse {
  Collection collection = 1;
}

// A move into the moved folder's own subtree, or onto an existing name, fails.
message MoveItemRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
  // Destination parent; empty is the root, the current parent means a pure reorder.
  repeated string new_path = 4;
  // Sibling in the destination to insert ahead of; unset (or stale) appends.
  optional string before = 5;
}

message MoveItemResponse {
  Collection collection = 1;
}

message GetRequest {
  string collection = 1;
}

message GetResponse {
  Collection collection = 1;
}

message ListCollectionsRequest {
  // Bypass the cached index and rescan.
  bool refresh = 1;
}

message CollectionSummary {
  // The workspace-relative path that addresses this collection; "." is the root itself.
  string id           = 1;
  // Display name. Never the id — a collection is addressed by its path and named
  // separately, so five of them may all be called "requests".
  string name         = 2;
  int32  source_count = 3;
  // Why this collection could not be summarized. A broken collection is a visible row,
  // not a failed listing.
  string error        = 4;
}

message ListCollectionsResponse {
  // Absolute path of the workspace root, so a caller with a cwd of its own (the CLI) can
  // resolve that cwd against the workspace it is talking to.
  string                      root        = 1;
  repeated CollectionSummary  collections = 2;
}

// A collection is only ever created by an explicit act — this RPC, or `grpcview
// init`. Nothing else may materialize one, or a stale query would scatter
// grpcview.json among a repo's project files.
message CreateCollectionRequest {
  // Workspace-relative directory to create it in; "." is the workspace root.
  string collection = 1;
  // Display name; empty defaults to the directory's own base name.
  string name       = 2;
}

message CreateCollectionResponse {
  Collection collection = 1;
}

// Everything an ad-hoc invoke needs except the client payload — the one thing
// the unary and streaming forms disagree about.
message InvokeSpec {
  string                 collection      = 1;
  // Parent-folder display-name path, outermost first; empty at the top level.
  repeated string        path            = 2;
  string                 item_name       = 3;
  string                 service         = 4;
  string                 method          = 5;
  google.protobuf.Struct metadata        = 6;
  // Unset defaults to the collection's first reflection source.
  optional Server        target          = 7;
  // TypeScript module; supersedes `metadata` when non-empty.
  string                 metadata_script = 8;
}

// Executes a unary RPC carrying the caller's own, possibly unsaved, body.
message InvokeRequest {
  InvokeSpec spec = 1;
  string     body = 2;
}

message InvokeResponse {
  Request.Response response = 1;
}

// All client messages are supplied up-front: connect-web cannot stream a body.
message InvokeStreamRequest {
  InvokeSpec      spec     = 1;
  // Client bodies as JSON text, in send order; empty defaults to one "{}".
  repeated string messages = 2;
}

// Zero or more `message` frames, then exactly one terminal `result`. The invoked
// call's gRPC status is reported in `result`, not as a Connect stream error.
message InvokeStreamingResponse {
  oneof event {
    bytes            message = 1;
    Request.Response result  = 2;
  }
}

// Addresses the request SAVED at path/item_name and says how to run it once;
// everything the unary and streaming saved forms share.
message SavedInvokeSpec {
  string                 collection     = 1;
  // Parent-folder display-name path, outermost first; empty at the top level.
  repeated string        path           = 2;
  string                 item_name      = 3;
  // This run's gv.request.params.
  google.protobuf.Struct params         = 4;
  // Unset uses the saved request's own target.
  optional Server        target         = 5;
  // Overrides the saved body for this run only.
  repeated string        messages       = 6;
  // Whether to append this run to the request's history. Defaults to TRUE.
  optional bool          record_history = 7;
}

// Runs the request SAVED at path/item_name, resolved server-side.
message InvokeSavedRequest {
  SavedInvokeSpec spec    = 1;
  // Resolve and evaluate everything, send nothing.
  bool            dry_run = 2;
}

// The streaming saved form has no dry_run: a dry run reports one resolved
// request, which is the unary shape.
message InvokeSavedStreamRequest {
  SavedInvokeSpec spec = 1;
}

// Exactly one of `response` (a real call) and `resolved` (a dry run) is set.
message InvokeSavedResponse {
  Request.Response         response = 1;
  optional ResolvedRequest resolved = 2;
}

// What a dry run reports: what would have been sent, post-middleware, nothing dialed.
message ResolvedRequest {
  string                 service  = 1;
  string                 method   = 2;
  Server                 target   = 3;
  repeated string        messages = 4;
  google.protobuf.Struct metadata = 5;
}

message DescribeMethodRequest {
  string collection = 1;
  // Fully qualified, e.g. "echo.v1.EchoService"; method is its own name, "Unary".
  string service        = 2;
  string method         = 3;
}

message DescribeMethodResponse {
  // The method, its input and output messages, and every type they reference.
  string proto_text        = 1;
  // The same closure, transitive imports included so it links on its own.
  bytes  descriptor_set    = 2;
  // The source it was read from, e.g. "reflection:localhost:9000".
  string source_id         = 3;
  bool   client_streaming  = 4;
  bool   server_streaming  = 5;
}

message CreateScriptRequest {
  string     collection = 1;
  string     name       = 2;
  ScriptKind kind       = 3;
}

message CreateScriptResponse {
  Collection collection = 1;
}

// Partial update: `name` addresses the script, `new_name` renames it.
message UpdateScriptRequest {
  string          collection = 1;
  string          name       = 2;
  optional string source     = 3;
  optional string new_name   = 4;
}

message UpdateScriptResponse {
  Collection collection = 1;
}

message DeleteScriptRequest {
  string collection = 1;
  string name       = 2;
}

message DeleteScriptResponse {
  Collection collection = 1;
}

message RunScriptRequest {
  string              collection = 1;
  string              source     = 2;
  // Unset evaluates `source` as a scratchpad, yielding its last-expression value.
  optional ScriptKind kind       = 3;
}

message ScriptLog {
  string level = 1;   // debug | log | warn | error
  string message = 2;
}

message ScriptError {
  string message = 1;
  string stack = 2;
  // Source line parsed from the guest backtrace; 0 when unknown.
  int32  line = 3;
}

// A script that throws or times out is reported in `error`, not as a Connect failure.
message RunScriptResponse {
  // JSON text; unset when the script returned undefined.
  optional string       value = 1;
  repeated ScriptLog     logs  = 2;
  optional ScriptError   error = 3;
}

service WorkspaceService {
  // AddDescriptorSource appends at LOWEST priority, or refreshes in place when
  // the source's id already exists.
  rpc AddDescriptorSource(AddDescriptorSourceRequest) returns (AddDescriptorSourceResponse);
  rpc RemoveDescriptorSource(RemoveDescriptorSourceRequest) returns (RemoveDescriptorSourceResponse);
  rpc RefreshDescriptorSource(RefreshDescriptorSourceRequest) returns (RefreshDescriptorSourceResponse);
  // ReorderDescriptorSources sets which source wins when several describe the
  // same protos.
  rpc ReorderDescriptorSources(ReorderDescriptorSourcesRequest) returns (ReorderDescriptorSourcesResponse);
  // SetDescriptorSourceCommit moves one source's descriptors between the
  // committed sidecar and the local blob store. It never dials or builds: the
  // bytes it writes are the ones already stored, so committing a source that has
  // never resolved is InvalidArgument rather than a resolve.
  rpc SetDescriptorSourceCommit(SetDescriptorSourceCommitRequest) returns (SetDescriptorSourceCommitResponse);
  // Get reports NOTHING implicitly: a collection that does not exist is NotFound,
  // never created on demand.
  rpc Get(GetRequest) returns (GetResponse);
  // ListCollections is deliberately cheap: it reads manifests, never trees. It is the
  // only thing a client needs before it knows which collection to Get, and since
  // Collection.descriptor_set is a merged FileDescriptorSet in bytes, eagerly Getting
  // every collection instead is the one way to make this design feel slow.
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
  rpc DeleteRequest(DeleteRequestRequest) returns (DeleteRequestResponse);
  rpc UpdateRequest(UpdateRequestRequest) returns (UpdateRequestResponse);
  rpc UpdateFolder(UpdateFolderRequest) returns (UpdateFolderResponse);
  rpc MoveItem(MoveItemRequest) returns (MoveItemResponse);
  // Invoke returns the status, response body, request/response metadata and latency.
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  // InvokeStreaming handles any streaming kind, modeled as server-streaming.
  rpc InvokeStreaming(InvokeStreamRequest) returns (stream InvokeStreamingResponse);
  // InvokeSaved reports a status the target returned in the response, never as
  // an error.
  rpc InvokeSaved(InvokeSavedRequest) returns (InvokeSavedResponse);
  // InvokeSavedStreaming is InvokeSaved for any streaming kind.
  rpc InvokeSavedStreaming(InvokeSavedStreamRequest) returns (stream InvokeStreamingResponse);
  // DescribeMethod answers from already-resolved definitions, so it works with
  // the target down. Doc comments survive only if the winning source carried
  // them — reflection strips them, an uploaded descriptor set keeps them.
  rpc DescribeMethod(DescribeMethodRequest) returns (DescribeMethodResponse);
  // RunScript uses a fresh isolated instance: no capabilities, no collection state.
  rpc RunScript(RunScriptRequest) returns (RunScriptResponse);
  rpc CreateScript(CreateScriptRequest) returns (CreateScriptResponse);
  rpc UpdateScript(UpdateScriptRequest) returns (UpdateScriptResponse);
  rpc DeleteScript(DeleteScriptRequest) returns (DeleteScriptResponse);
}
