syntax = "proto3";

package grpcview.v1;

import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "proto/grpcview/v1/workspace.proto";

option go_package = "codeberg.org/ramilmsh/grpcview/proto/grpcview/v1;grpcviewv1";

message AddDescriptorSourceRequest {
  string collection = 1;
  oneof source {
    bytes  descriptor_set = 2;
    Server reflection     = 3;
    Bazel  bazel          = 6;
  }
  // Identity of a descriptor_set upload; re-uploading the same name refreshes it.
  string file_name = 4;
  // Refresh recipe for a descriptor_set upload. Absolute or workspace-relative;
  // stored root-relative. Empty from a browser, which only loses refresh.
  string path = 7;
  // See DescriptorSource.commit_descriptors.
  bool commit_descriptors = 5;
}

message AddDescriptorSourceResponse {
  Collection collection = 1;
}

message RemoveDescriptorSourceRequest {
  string collection = 1;
  string id = 2;
}

message RemoveDescriptorSourceResponse {
  Collection collection = 1;
}

message RefreshDescriptorSourceRequest {
  string collection = 1;
  string id = 2;
}

message RefreshDescriptorSourceResponse {
  Collection collection = 1;
}

message ReorderDescriptorSourcesRequest {
  string collection = 1;
  // Every DescriptorSource.id in priority order — earlier wins; must be a permutation.
  repeated string ids = 2;
}

message ReorderDescriptorSourcesResponse {
  Collection collection = 1;
}

message SetDescriptorSourceCommitRequest {
  string collection = 1;
  string id = 2;
  bool commit = 3;
}

message SetDescriptorSourceCommitResponse {
  Collection collection = 1;
}

message CreateFolderRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
}

message CreateFolderResponse {
  Collection collection = 1;
}

message CreateRequestRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
  string service = 4;
  string method = 5;
}

message CreateRequestResponse {
  Collection collection = 1;
  // Non-fatal: the request was created. Says what about it will not work yet, e.g.
  // a streaming method, which invoke rejects with Unimplemented.
  repeated string warnings = 2;
}

message DeleteRequestRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
}

message DeleteRequestResponse {
  Collection collection = 1;
}

message UpdateRequestRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
  optional string service = 4;
  optional string method = 5;
  optional string draft_body = 6;
  optional string name = 8;
  // Set-flag: true replaces `middleware` (empty clears it), false/unset leaves it.
  optional bool update_middleware = 9;
  repeated string middleware = 10;
  // TypeScript module; empty-but-present clears it.
  optional string draft_metadata_script = 12;
  // Set-flag: true replaces `target` (nil clears it), false/unset leaves it.
  optional bool update_target = 13;
  optional Server target = 14;
}

message UpdateRequestResponse {
  Collection collection = 1;
}

message UpdateFolderRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
  // TypeScript module feeding the gv.metadata.inherit() chain; empty clears it.
  optional string draft_metadata_script = 4;
  optional string name = 5;
}

message UpdateFolderResponse {
  Collection collection = 1;
}

// A move into the moved folder's own subtree, or onto an existing name, fails.
message MoveItemRequest {
  string collection = 1;
  repeated string path = 2;
  string item_name = 3;
  // Destination parent; empty is the root, the current parent means a pure reorder.
  repeated string new_path = 4;
  // Sibling in the destination to insert ahead of; unset (or stale) appends.
  optional string before = 5;
}

message MoveItemResponse {
  Collection collection = 1;
}

message GetRequest {
  string collection = 1;
}

message GetResponse {
  Collection collection = 1;
}

message ListCollectionsRequest {
  // Was `refresh`: the listing is never memoized, so every call already rescans.
  reserved 1;
  reserved "refresh";
}

message CollectionSummary {
  // Workspace-relative path that addresses this collection; "." is the root.
  string id           = 1;
  // Display name, never the id — five collections may all be called "requests".
  string name         = 2;
  int32  source_count = 3;
  // Why this collection could not be summarized; a broken one is a visible row.
  string error        = 4;
}

message ListCollectionsResponse {
  // Absolute workspace root, so a caller with a cwd of its own (the CLI) can
  // resolve that cwd against the workspace it is talking to.
  string                      root        = 1;
  repeated CollectionSummary  collections = 2;
  // Whether this root is trusted. Trust gates ONLY the source kinds that EXECUTE
  // (a bazel label); reflection and uploads resolve regardless.
  bool                        trusted     = 3;
}

message SetWorkspaceTrustRequest {
  bool trusted = 1;
}

message SetWorkspaceTrustResponse {
  // The resulting state, so a client never has to guess whether the flip took.
  bool trusted = 1;
}

// Takes no arguments on purpose: the query is built here, never from client
// input, since the label validator cannot check a query expression.
message ListBazelTargetsRequest {}

message ListBazelTargetsResponse {
  // Canonical labels, sorted, deduped. A SUGGESTION list: the field stays free
  // text, because an unknown rule can still produce a descriptor set.
  repeated string labels = 1;
  // Why the listing is short, when bazel errored but the query survived (one
  // unloadable package under --keep_going). Never a reason to refuse the labels.
  string warning = 2;
}

// An importable TypeScript module in the workspace, as the editors need it:
// contents, not declarations — the inferred types are the point.
message WorkspaceModule {
  // Workspace-relative, slash-separated: "example/scripts/uuid.ts".
  string path    = 1;
  string content = 2;
}

message ListWorkspaceModulesRequest {}
message ListWorkspaceModulesResponse {
  repeated WorkspaceModule modules = 1;
}

// A collection is only ever created by an explicit act — this RPC, or
// `grpcview init` — or a stale query would scatter grpcview.json around a repo.
message CreateCollectionRequest {
  // Workspace-relative directory to create it in; "." is the workspace root.
  string collection = 1;
  // Display name; empty defaults to the directory's own base name.
  string name       = 2;
}

message CreateCollectionResponse {
  Collection collection = 1;
}

// The two names a collection has, editable independently: `name` is manifest
// text, `new_collection` is the directory the collection lives in. An unset
// field is left alone.
message UpdateCollectionRequest {
  // The collection to edit, addressed as it is now.
  string          collection     = 1;
  // New display name. Empty resets it to the directory's own base name.
  optional string name           = 2;
  // New workspace-relative directory; MOVES the directory on disk. Neither the
  // source nor the destination may be ".", and the destination must not exist.
  optional string new_collection = 3;
}

message UpdateCollectionResponse {
  Collection collection = 1;
}

// Everything an ad-hoc invoke needs except the client payload — the one thing
// the unary and streaming forms disagree about.
message InvokeSpec {
  string                 collection      = 1;
  // Parent-folder display-name path, outermost first; empty at the top level.
  repeated string        path            = 2;
  string                 item_name       = 3;
  string                 service         = 4;
  string                 method          = 5;
  google.protobuf.Struct metadata        = 6;
  // Unset defaults to the collection's first reflection source.
  optional Server        target          = 7;
  // TypeScript module; supersedes `metadata` when non-empty.
  string                 metadata_script = 8;
}

// Executes a unary RPC carrying the caller's own, possibly unsaved, body.
message InvokeRequest {
  InvokeSpec spec = 1;
  // The request message as a JSON object, or a TypeScript module default-exporting
  // one — valid JSON is already valid TS, so both forms parse. Quote 64-bit ints:
  // an unquoted one loses precision. Empty sends an empty message.
  string     body = 2;
}

message InvokeResponse {
  Request.Response response = 1;
}

// All client messages are supplied up-front: connect-web cannot stream a body.
message InvokeStreamRequest {
  InvokeSpec      spec     = 1;
  // Client bodies as JSON text, in send order; empty defaults to one "{}".
  repeated string messages = 2;
}

// Zero or more `message` frames, then exactly one terminal `result`. The invoked
// call's gRPC status is reported in `result`, not as a Connect stream error.
message InvokeStreamingResponse {
  oneof event {
    bytes            message = 1;
    Request.Response result  = 2;
  }
}

// Addresses the request SAVED at path/item_name and says how to run it once.
message SavedInvokeSpec {
  string                 collection     = 1;
  // Parent-folder display-name path, outermost first; empty at the top level.
  repeated string        path           = 2;
  string                 item_name      = 3;
  // This run's gv.request.params.
  google.protobuf.Struct params         = 4;
  // Unset uses the saved request's own target.
  optional Server        target         = 5;
  // Overrides the saved body for this run only.
  repeated string        messages       = 6;
  // Append this run to the request's history. Defaults to TRUE.
  optional bool          record_history = 7;
}

// Runs the request SAVED at path/item_name, resolved server-side.
message InvokeSavedRequest {
  SavedInvokeSpec spec    = 1;
  // Resolve and evaluate everything, send nothing.
  bool            dry_run = 2;
}

// No dry_run: a dry run reports one resolved request, which is the unary shape.
message InvokeSavedStreamRequest {
  SavedInvokeSpec spec = 1;
}

// Exactly one of `response` (a real call) and `resolved` (a dry run) is set.
message InvokeSavedResponse {
  Request.Response         response = 1;
  optional ResolvedRequest resolved = 2;
}

// What a dry run reports: what would have been sent, post-middleware, nothing dialed.
message ResolvedRequest {
  string                 service  = 1;
  string                 method   = 2;
  Server                 target   = 3;
  repeated string        messages = 4;
  google.protobuf.Struct metadata = 5;
}

message DescribeMethodRequest {
  string collection = 1;
  // Fully qualified, e.g. "echo.v1.EchoService"; method is its own name, "Unary".
  string service        = 2;
  string method         = 3;
}

message DescribeMethodResponse {
  // The method, its input and output messages, and every type they reference.
  string proto_text        = 1;
  // The same closure, transitive imports included so it links on its own.
  bytes  descriptor_set    = 2;
  // The source it was read from, e.g. "reflection:localhost:9000".
  string source_id         = 3;
  bool   client_streaming  = 4;
  bool   server_streaming  = 5;
  // Why invoking this method would fail today; empty when it is invocable. Set for
  // every streaming method, which invoke rejects with Unimplemented.
  string not_invocable_reason = 6;
}

message CreateScriptRequest {
  string collection = 1;
  string path       = 2;
}

message CreateScriptResponse {
  Collection collection = 1;
}

// Partial update: `path` addresses the script, `new_path` renames it (a rename is a file move).
message UpdateScriptRequest {
  string          collection = 1;
  string          path       = 2;
  optional string source     = 3;
  optional string new_path   = 4;
}

message UpdateScriptResponse {
  Collection collection = 1;
}

message DeleteScriptRequest {
  string collection = 1;
  string path       = 2;
}

message DeleteScriptResponse {
  Collection collection = 1;
}

message RunScriptRequest {
  string collection = 1;
  // A source with `export default` is compiled as an entry and its default export is
  // called; anything else is evaluated as a scratchpad and its last expression is the
  // value. Ignored when `script` names a saved script, which follows the same rule.
  string          source = 2;
  // Path of a saved script to run instead of `source`. Exactly one of the two.
  optional string script = 4;
}

message ScriptLog {
  string level = 1;   // debug | log | warn | error
  string message = 2;
}

message ScriptError {
  string message = 1;
  string stack = 2;
  // Source line parsed from the guest backtrace; 0 when unknown.
  int32  line = 3;
}

// A script that throws or times out is reported in `error`, not as a Connect failure.
message RunScriptResponse {
  // JSON text; unset when the script returned undefined.
  optional string       value = 1;
  repeated ScriptLog     logs  = 2;
  optional ScriptError   error = 3;
}

service WorkspaceService {
  // Appends at LOWEST priority, or refreshes in place when the id already exists.
  rpc AddDescriptorSource(AddDescriptorSourceRequest) returns (AddDescriptorSourceResponse);
  // Never dials, so an unreachable sibling source cannot block a removal. Services
  // only this source provided leave the services list; requests against them remain
  // saved but stop being invocable.
  rpc RemoveDescriptorSource(RemoveDescriptorSourceRequest) returns (RemoveDescriptorSourceResponse);
  // Re-dials a reflection target, or re-reads an upload. An unreachable target stays
  // listed with the reason in its resolved.error rather than being dropped.
  rpc RefreshDescriptorSource(RefreshDescriptorSourceRequest) returns (RefreshDescriptorSourceResponse);
  // Sets which source wins when several describe the same protos.
  rpc ReorderDescriptorSources(ReorderDescriptorSourcesRequest) returns (ReorderDescriptorSourcesResponse);
  // Moves one source's descriptors between the committed sidecar and the local
  // blob store. Never dials or builds, so committing a source that has never
  // resolved is InvalidArgument.
  rpc SetDescriptorSourceCommit(SetDescriptorSourceCommitRequest) returns (SetDescriptorSourceCommitResponse);
  // A collection that does not exist is NotFound, never created on demand.
  rpc Get(GetRequest) returns (GetResponse);
  // Deliberately cheap: reads manifests, never trees. Eagerly Getting every
  // collection instead is the one way to make this design feel slow.
  rpc ListCollections(ListCollectionsRequest) returns (ListCollectionsResponse);
  // Trusts or un-trusts this workspace ROOT, like VS Code's Workspace Trust: a
  // committed bazel label means opening a repo could run arbitrary code. Trust is
  // on the folder, not its content. Revoking un-resolves nothing — only a future
  // build is refused.
  rpc SetWorkspaceTrust(SetWorkspaceTrustRequest) returns (SetWorkspaceTrustResponse);
  // Lists the workspace's descriptor-set-producing labels, so adding a bazel
  // source can be a pick. Runs `bazel query`, which loads BUILD files, so it is
  // trust-gated: an untrusted workspace gets FailedPrecondition, not an empty list.
  rpc ListBazelTargets(ListBazelTargetsRequest) returns (ListBazelTargetsResponse);
  // Every importable `.ts` under the workspace root, so the editor's module resolution
  // (Monaco `compilerOptions.paths`) can mirror what the bundler's `@/` / `#/` plugin
  // actually resolves at compile time.
  rpc ListWorkspaceModules(ListWorkspaceModulesRequest) returns (ListWorkspaceModulesResponse);
  // Creates the collection's directory in the workspace. An existing collection at
  // that path is AlreadyExists, never adopted.
  rpc CreateCollection(CreateCollectionRequest) returns (CreateCollectionResponse);
  // Renames a collection's display name and/or MOVES its directory. The local
  // state (history, resolve caches) moves with it; nothing is re-resolved.
  rpc UpdateCollection(UpdateCollectionRequest) returns (UpdateCollectionResponse);
  // A name colliding with an existing sibling is FailedPrecondition.
  rpc CreateFolder(CreateFolderRequest) returns (CreateFolderResponse);
  // The body starts empty. Saving is optional: invoke calls a method without one.
  rpc CreateRequest(CreateRequestRequest) returns (CreateRequestResponse);
  // Deletes requests AND folders, a folder recursively. An item that is not there is
  // a silent success, so check the returned tree rather than relying on an error.
  rpc DeleteRequest(DeleteRequestRequest) returns (DeleteRequestResponse);
  // Partial update: everything but the fields locating the request is optional, and an
  // omitted one is left as it was. `target` and `middleware` change only when their
  // update_ set-flag is true.
  rpc UpdateRequest(UpdateRequestRequest) returns (UpdateRequestResponse);
  // Sets the metadata script requests inside the folder inherit, so shared headers are
  // written once. Present but empty clears it; omitted leaves it unchanged.
  rpc UpdateFolder(UpdateFolderRequest) returns (UpdateFolderResponse);
  // Reparents and/or reorders one item. Moving a folder into its own descendant is
  // FailedPrecondition.
  rpc MoveItem(MoveItemRequest) returns (MoveItemResponse);
  // Returns the status, response body, request/response metadata and latency.
  rpc Invoke(InvokeRequest) returns (InvokeResponse);
  // Handles any streaming kind, modeled as server-streaming.
  rpc InvokeStreaming(InvokeStreamRequest) returns (stream InvokeStreamingResponse);
  // Reports a status the target returned in the response, never as an error.
  rpc InvokeSaved(InvokeSavedRequest) returns (InvokeSavedResponse);
  // InvokeSaved for any streaming kind.
  rpc InvokeSavedStreaming(InvokeSavedStreamRequest) returns (stream InvokeStreamingResponse);
  // Answers from already-resolved definitions, so it works with the target down.
  // Doc comments survive only if the winning source carried them.
  rpc DescribeMethod(DescribeMethodRequest) returns (DescribeMethodResponse);
  // Uses a fresh isolated instance: no capabilities, no collection state.
  rpc RunScript(RunScriptRequest) returns (RunScriptResponse);
  // Creates it empty; use UpdateScript to fill in the source.
  rpc CreateScript(CreateScriptRequest) returns (CreateScriptResponse);
  // Partial update: an omitted field is left unchanged. Renaming onto an existing
  // script's path fails.
  rpc UpdateScript(UpdateScriptRequest) returns (UpdateScriptResponse);
  // Requests still listing it as middleware keep the dangling reference and fail when
  // invoked, so clear it from them first.
  rpc DeleteScript(DeleteScriptRequest) returns (DeleteScriptResponse);
}

// Identity of the binary a server is running, so a client can tell a daemon serving
// last hour's code from one serving this build. A version STRING cannot: an unstamped
// build links "dev" for every rebuild.
message ServerExecutable {
  string path           = 1;
  int64  modified_unix  = 2;
  int64  size           = 3;
}

message ServerInfoRequest {}

message ServerInfoResponse {
  // Absolute, and the field the whole registration design turns on: a client verifies
  // it matches the root it resolved before trusting anything else the server says.
  string           workspace_root = 1;
  int32            pid            = 2;
  int32            port           = 3;
  string           version        = 4;
  ServerExecutable executable     = 5;
  // Zero when the server never idles out, which is every hand-run one.
  google.protobuf.Duration idle_timeout = 6;
}

message ShutdownRequest {}

message ShutdownResponse {}

// One registered server as the answering one sees it. The registration fields are read off
// the file; everything else is what that server itself answered, so a row that is not
// running carries only what the file claimed.
message ServerEntry {
  string           workspace_root = 1;
  int32            port           = 2;
  int32            pid            = 3;
  string           version        = 4;
  ServerExecutable executable     = 5;
  // Zero when it never idles out, which is every hand-run one.
  google.protobuf.Duration idle_timeout = 6;
  int64            started_unix   = 7;
  // A registration is a hint: false means nothing answered on that port, or what did
  // reports another root. The file outliving its process is the ordinary case.
  bool             running        = 8;
  // The server answering this call, so a client can tell which row it is talking through.
  bool             current        = 9;
  // Answers, and it is that workspace's, but it is running a different build than the
  // server answering this call.
  bool             skewed         = 10;
}

message ListServersRequest {}

message ListServersResponse {
  // Every registration on this machine for this user, ordered by workspace root.
  repeated ServerEntry servers = 1;
}

message StopServerRequest {
  // Absolute, and matched against the registration rather than against a port: a port is
  // reused, a root is the identity.
  string workspace_root = 1;
}

message StopServerResponse {}

// Server lifecycle, deliberately NOT part of WorkspaceService: it is a property of the
// process, it is meaningless in-process, and Shutdown has no business being an MCP tool.
service ServerService {
  // Never fails. Answering it at all is what proves a listener is this workspace's.
  rpc ServerInfo(ServerInfoRequest) returns (ServerInfoResponse);
  // Returns first, then stops accepting, drains in flight requests and unlinks the
  // registration. Asking over the wire is why the design never has to signal a pid.
  rpc Shutdown(ShutdownRequest) returns (ShutdownResponse);
  // Every server registered on this machine, this one included, each verified over the
  // wire before it is reported running. Reads the registry, never a process table.
  rpc ListServers(ListServersRequest) returns (ListServersResponse);
  // Asks another workspace's server to exit, after verifying it is that workspace's, and
  // waits for it to go. Naming this server's own root is Shutdown.
  rpc StopServer(StopServerRequest) returns (StopServerResponse);
}
