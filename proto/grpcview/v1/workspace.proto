syntax = "proto3";

package grpcview.v1;

import "google/protobuf/any.proto";
import "google/protobuf/descriptor.proto";
import "google/protobuf/duration.proto";
import "google/protobuf/struct.proto";
import "google/protobuf/timestamp.proto";

option go_package = "codeberg.org/ramilmsh/grpcview/proto/grpcview/v1;grpcviewv1";

// Status is a copy of google.rpc.Status, this is a hack, because we can't import google/rpc/status.proto for rules_ts
message Status {
  int32                        code    = 1;
  string                       message = 2;
  repeated google.protobuf.Any details = 3;
}

message Server {
  message TLS {}

  string host = 1;
  int32 port = 2;
  optional TLS tls = 3;
}

message Message {
  string                          package = 1;
  string                          name    = 2;
  optional google.protobuf.Struct schema  = 3;
  // file is the proto file path that defines this message (e.g.
  // proto/foo/v1/foo.proto). It is the protoc-gen-es fileToGenerate selector and
  // identifies which generated _pb.ts exports this message's Json type
  // (ts-request-body-plan §T2/§4.4). Derived from the resolved descriptor.
  string                          file    = 4;
}

message Method {
  string  name             = 1;
  Message input            = 2;
  Message output           = 3;
  // client_streaming / server_streaming carry the method's real streaming kind,
  // populated from reflection's IsClientStreaming/IsServerStreaming. The four
  // combinations map to unary (both false), server-streaming, client-streaming,
  // and bidi (both true).
  bool    client_streaming = 4;
  bool    server_streaming = 5;
}

message Service {
  string          package = 1;
  string          name    = 2;
  repeated Method methods = 3;
  // source is the reflection server this service's schema was resolved from — the
  // natural default invoke target for a request against it (see resolveTarget in
  // invoke.go, and sourceForService in the UI). Unset for services from a
  // descriptor-set upload (no dial target) or an older cache; such requests fall
  // back to the workspace's first reflection source.
  optional Server source  = 4;
}

message DescriptorSource {
  oneof source {
    bytes  descriptor_set = 1;
    Server reflection     = 2;
  }
}

message Folder {
  repeated Item items = 1;
}

message History {
  message Request {
    string                 service  = 1;
    string                 method   = 2;
    bytes                  body     = 3;
    google.protobuf.Struct metadata = 4;
  }
  message Response {
    Status                    status    = 1;
    bytes                     response  = 2;
    google.protobuf.Struct    metadata  = 3;
    google.protobuf.Duration  latency   = 4;
    google.protobuf.Timestamp timestamp = 5;
  }
  Request                   request   = 1;
  Response                  response  = 2;
}

message Request {
  message Response {
    Status                    status            = 1;
    bytes                     response          = 2;
    google.protobuf.Struct    request_metadata  = 3;
    google.protobuf.Struct    response_metadata = 4;
    google.protobuf.Duration  latency           = 5;
    google.protobuf.Timestamp timestamp         = 6;
  }
  string                    name              = 1;
  string                    service           = 2;
  string                    method            = 3;
  string                    draft_body        = 4;
  google.protobuf.Struct    draft_metadata    = 5;
  repeated History          history           = 6;
  // middleware is the ordered display names of the MIDDLEWARE-kind scripts
  // attached to this request; each runs (in this order) before the call to
  // rewrite the outgoing body/metadata (scripting-ui-plan §S3).
  repeated string           middleware        = 7;
  // body_language selects how draft_body is interpreted on invoke: JSON — sent
  // as-is (the default; today's path + {{ }} tokens) — or TYPESCRIPT, where
  // draft_body is a TS/JS generator whose returned object is the request message
  // (ts-request-body-plan §T1). See BodyLanguage.
  BodyLanguage              body_language     = 8;
  // draft_metadata_script is the request's metadata authored as a TypeScript
  // module (`export default (): Metadata => ({ ... })`) whose returned
  // {[key: string]: string[]} object is evaluated on invoke to build the
  // outgoing metadata. It replaces the key/value grid that persisted through
  // draft_metadata (kept above only for reading requests saved before this
  // field). Mirrors draft_body — a plain UTF-8 string.
  string                    draft_metadata_script = 9;
  // target overrides where this request's invoke is sent (host:port + TLS).
  // Unset means "use the workspace's first reflection source" (see
  // resolveTarget in invoke.go). The first slice of the storage.md §6
  // target-vs-source split: a plain per-request inline target — no
  // refs/inheritance yet.
  optional Server           target                = 10;
}

// Item is a single element in the treeview
message Item {
  string  name    = 1;
  oneof content {
    Folder  folder  = 2;
    Request request = 3;
  }
}

// BodyLanguage selects how a Request's draft_body is interpreted on invoke.
// Mirrors the on-disk grpcview.store.v1.BodyLanguage. UNSPECIFIED and JSON both
// mean "send the body as-is" (today's JSON path + {{ }} tokens), so a request
// saved before this field existed (UNSPECIFIED) behaves exactly as JSON.
enum BodyLanguage {
  BODY_LANGUAGE_UNSPECIFIED = 0;
  BODY_LANGUAGE_JSON = 1;
  BODY_LANGUAGE_TYPESCRIPT = 2;
}

// ScriptKind classifies a saved script by how it is invoked. Mirrors the on-disk
// grpcview.store.v1.ScriptKind.
enum ScriptKind {
  SCRIPT_KIND_UNSPECIFIED = 0;
  SCRIPT_KIND_GENERATOR = 1;
  SCRIPT_KIND_MIDDLEWARE = 2;
  SCRIPT_KIND_SCENARIO = 3;
}

// Script is a saved script in the collection: a kind, a display name, and the
// authored source. Persisted under scripts/<slug>/script.json.
message Script {
  string     name   = 1;
  ScriptKind kind   = 2;
  string     source = 3;
}

// Workspace is a state of the workspace
message Workspace {
  string                    name     = 1;
  Item                      item     = 2;
  repeated DescriptorSource sources  = 3;
  repeated Service          services = 4;
  repeated Script           scripts  = 5;
  // descriptor_set is the merged, deduped FileDescriptorSet (transitive deps
  // incl. WKTs, topo-sorted) that protoc-gen-es needs to type request bodies
  // client-side (ts-request-body-plan §T2/§4.4). It is DERIVED from the resolved
  // descriptors and cached alongside services (gitignored services.json), never
  // committed to grpcview.json and not part of grpcview.store.v1.
  bytes                     descriptor_set = 6;
}
