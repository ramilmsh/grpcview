actions:
  - name: "Test all targets"
    container_image: "ubuntu-22.04"
    triggers:
      push:
        branches:
          - "trunk"
      pull_request:
        branches:
          - "*"
    steps:
      # --test_output=errors, because a failing test otherwise prints only the path
      # of a test.log inside the workflow container, which is gone by the time
      # anyone reads the workflow log.
      - run: "bazel test --config=ci --test_output=errors //..."

  - name: "Release"
    container_image: "ubuntu-22.04"
    triggers:
      push:
        branches:
          - "trunk"
        tags:
          - "v*"
    steps:
      - run: |
          set -euo pipefail

          repo=$(git remote get-url origin 2>/dev/null | sed -E 's#^https://[^@]*@#https://#; s#^.*github\.com[:/]##; s#\.git$##' || true)
          sha=$(git rev-parse HEAD 2>/dev/null || true)

          log=$(mktemp)
          exec > >(tee "$log") 2>&1
          report_failure() {
            code=$?
            set +x
            if [ "$code" = 0 ]; then
              return 0
            fi
            body=$(tail -n 250 "$log" |
              sed "s|$REPO_TOKEN|REDACTED|g" |
              tr '\t' ' ' | tr -d '\000-\010\013-\037' |
              sed -e 's|\\|\\\\|g' -e 's|"|\\"|g' |
              awk '{printf "%s\\n", $0}')
            curl -sS -X POST \
              -H "Authorization: Bearer $REPO_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$repo/commits/$sha/comments" \
              -d "{\"body\":\"Release action failed (exit $code).\\n\\n\`\`\`\\n$body\\n\`\`\`\"}" \
              >/dev/null || true
            cp "$log" "${BUILDBUDDY_ARTIFACTS_DIR:-/tmp}/release.log" || true
          }
          trap report_failure EXIT
          set -x

          [ -n "$repo" ] && [ -n "$sha" ] || { echo "error: could not read the repository from origin" >&2; exit 1; }

          git fetch --tags --force origin

          export PATH="$HOME/.local/bin:$PATH"
          if ! command -v gh >/dev/null 2>&1; then
            arch=$(dpkg --print-architecture)
            gh_version=$(curl -fsSL -o /dev/null -w '%{url_effective}' \
              https://github.com/cli/cli/releases/latest | sed -n 's|.*/tag/v||p')
            [ -n "$gh_version" ] || { echo "error: could not resolve the latest gh release" >&2; exit 1; }
            echo "==> installing gh $gh_version"
            mkdir -p "$HOME/.local/bin"
            curl -fsSL "https://github.com/cli/cli/releases/download/v${gh_version}/gh_${gh_version}_linux_${arch}.tar.gz" |
              tar -xz -C "$HOME/.local" --strip-components=1 "gh_${gh_version}_linux_${arch}/bin/gh"
          fi
          export GH_TOKEN="$REPO_TOKEN"

          version=$(tools/version.sh)
          case "$version" in
          *+dirty) echo "error: worktree is modified; version.sh gave $version" >&2; exit 1 ;;
          esac
          echo "==> $repo $version"

          if gh release view "$version" --repo "$repo" >/dev/null 2>&1; then
            echo "$version is already published; nothing to do"
            exit 0
          fi

          tools/stage_release.sh \
            --dest dist \
            --base-url "https://github.com/$repo/releases/download" \
            --bazel-config ci

          ls -l dist
          for artifact in dist/grpcview_*; do
            printf '%s %s\n' "$artifact" "$(od -An -t x1 -N4 "$artifact" | tr -d ' ')"
          done

          if [ "${DRY_RUN:-}" = 1 ]; then
            echo "dry run: staged $version without publishing it"
            exit 0
          fi

          notes=$(printf '## Install\n\n```sh\ncurl -fsSL https://github.com/%s/releases/latest/download/install.sh | sh\n```\n' "$repo")
          gh release create "$version" \
            --repo "$repo" \
            --target "$(git rev-parse HEAD)" \
            --title "$version" \
            --latest \
            --generate-notes \
            --notes "$notes" \
            dist/grpcview_* dist/SHA256SUMS dist/latest dist/install.sh dist/uninstall.sh
