actions:
  - name: "Test all targets"
    container_image: "ubuntu-22.04"
    triggers:
      push:
        branches:
          - "trunk"
      pull_request:
        branches:
          - "*"
    steps:
      # --test_output=errors, because a failing test otherwise prints only the path
      # of a test.log inside the workflow container, which is gone by the time
      # anyone reads the workflow log.
      - run: "bazel test --config=ci --test_output=errors //..."
