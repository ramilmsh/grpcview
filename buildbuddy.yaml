actions:
  - name: "Test all targets"
    container_image: "ubuntu-22.04"
    triggers:
      push:
        branches:
          - "trunk"
      pull_request:
        branches:
          - "*"
    steps:
      - run: "bazel test --config=ci --test_output=errors //..."

  - name: "Release"
    container_image: "ubuntu-22.04"
    triggers:
      push:
        branches:
          - "trunk"
        tags:
          - "v*"
    steps:
      - run: |
          bazel run --config=ci --stamp -c opt //tools:release -- --dest dist ${DRY_RUN:+--dry-run}
